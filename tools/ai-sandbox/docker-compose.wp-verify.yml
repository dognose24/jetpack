# Compose override for wp-verify mode.
# Grants jetpack-ai-sandbox host Docker socket access and mounts the
# premium-analytics plugin + mu-loader into the WordPress container.
# JETPACK_HOST_PATH must be the jetpack root on the HOST filesystem
# (auto-detected by wp-verify.sh; set manually when running docker compose directly).
#
# Usage: tools/ai-sandbox/wp-verify.sh [up|down]
services:
  jetpack-ai:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  wordpress:
    volumes:
      # premium-analytics plugin source (read-only bind mount from host)
      - ${JETPACK_HOST_PATH:?JETPACK_HOST_PATH not set — run via wp-verify.sh}/projects/packages/premium-analytics:/var/www/html/wp-content/plugins/premium-analytics:ro
      # mu-plugin that bootstraps premium-analytics in the test WP install
      - ${JETPACK_HOST_PATH:?JETPACK_HOST_PATH not set — run via wp-verify.sh}/tools/ai-sandbox/wp-verify/mu-loader.php:/var/www/html/wp-content/mu-plugins/00-premium-analytics.php:ro
